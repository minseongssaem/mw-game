<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME - 진행자</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --m-glow: #ff1744;
            --w-color: #00d9ff;
            --w-glow: #00bcd4;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-mid);
            border-radius: 12px;
        }

        .round-info {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            color: var(--accent);
        }

        .timer {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            color: var(--w-color);
            text-shadow: 0 0 20px var(--w-glow);
        }

        .timer.warning {
            color: var(--m-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .phase-indicator {
            text-align: center;
            padding: 15px;
            background: var(--bg-light);
            border-radius: 8px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Discussion Phase */
        .discussion-panel {
            text-align: center;
            padding: 60px 20px;
        }

        .discussion-title {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--m-color), var(--w-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .discussion-message {
            font-size: 1.5rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        /* Submission Phase */
        .submission-panel {
            max-width: 1000px;
            margin: 0 auto;
        }

        .submission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .submission-card {
            background: var(--bg-mid);
            border: 2px solid var(--text-secondary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .submission-card.submitted {
            border-color: var(--w-color);
            background: rgba(0, 217, 255, 0.1);
        }

        .submission-team {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .submission-status {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .submission-card.submitted .submission-status {
            color: var(--w-color);
        }

        /* Results Phase */
        .results-panel {
            max-width: 1200px;
            margin: 0 auto;
        }

        .matches-grid {
            display: grid;
            gap: 30px;
            margin-bottom: 30px;
        }

        .match-card {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            align-items: center;
        }

        .team-result {
            text-align: center;
        }

        .team-name {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .card-display {
            width: 100px;
            height: 140px;
            margin: 0 auto 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-display.m-card {
            background: var(--m-color);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.5);
        }

        .card-display.w-card {
            background: var(--w-color);
            color: var(--bg-dark);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.5);
        }

        .score-change {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .score-change.positive {
            color: var(--w-color);
        }

        .score-change.negative {
            color: var(--m-color);
        }

        .vs-divider {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            color: var(--text-secondary);
        }

        /* Scoreboard */
        .scoreboard {
            background: var(--bg-mid);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .scoreboard-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .score-item {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid var(--text-secondary);
        }

        .score-team {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .score-value {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--w-color);
        }

        .score-item.leader {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .score-item.leader .score-value {
            color: var(--accent);
        }

        .btn {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 20px 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--m-color) 0%, var(--w-color) 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(255, 51, 102, 0.3),
                0 4px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .match-card {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .vs-divider {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="round-info">
                ROUND <span id="currentRound">1</span> / <span id="totalRounds">9</span>
            </div>
            <div class="timer" id="timer">00:00</div>
            <div class="phase-indicator" id="phaseIndicator">대기 중</div>
        </div>

        <!-- Discussion Phase -->
        <div id="discussionScreen" class="screen active">
            <div class="discussion-panel">
                <div class="discussion-title">회의 시간</div>
                <div class="discussion-message">
                    각 팀은 전략을 논의하세요<br>
                    M 또는 W 카드 중 무엇을 낼지 결정하세요
                </div>
                
                <!-- 게임 규칙 표시 -->
                <div style="margin: 40px auto; max-width: 800px; background: var(--bg-mid); border: 2px solid var(--bg-light); border-radius: 12px; padding: 30px;">
                    <div style="font-size: 1.3rem; color: var(--accent); margin-bottom: 15px; text-align: center;">게임 규칙</div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                        <div style="background: var(--bg-dark); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-family: 'Orbitron', monospace; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-secondary);">M vs M</div>
                            <div style="font-size: 1.2rem; font-weight: 700;"><span style="color: var(--m-color);">-3점</span> / <span style="color: var(--m-color);">-3점</span></div>
                        </div>
                        <div style="background: var(--bg-dark); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-family: 'Orbitron', monospace; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-secondary);">M vs W</div>
                            <div style="font-size: 1.2rem; font-weight: 700;"><span style="color: var(--w-color);">+6점</span> / <span style="color: var(--m-color);">-6점</span></div>
                        </div>
                        <div style="background: var(--bg-dark); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-family: 'Orbitron', monospace; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-secondary);">W vs M</div>
                            <div style="font-size: 1.2rem; font-weight: 700;"><span style="color: var(--m-color);">-6점</span> / <span style="color: var(--w-color);">+6점</span></div>
                        </div>
                        <div style="background: var(--bg-dark); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-family: 'Orbitron', monospace; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-secondary);">W vs W</div>
                            <div style="font-size: 1.2rem; font-weight: 700;"><span style="color: var(--w-color);">+3점</span> / <span style="color: var(--w-color);">+3점</span></div>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 50px; display: flex; gap: 20px; justify-content: center;">
                    <button class="btn btn-primary" onclick="startDiscussionTimer()" id="startRoundButton">
                        <span>라운드 시작</span>
                    </button>
                    <button class="btn btn-secondary" onclick="skipToSubmission()" id="skipToSubmitButton" style="display: none;">
                        <span>카드 제출 시작</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Submission Phase -->
        <div id="submissionScreen" class="screen">
            <div class="submission-panel">
                <div class="scoreboard">
                    <div class="scoreboard-title">현재 점수</div>
                    <div class="scores-grid" id="currentScores"></div>
                </div>

                <h2 style="text-align: center; font-family: 'Orbitron', monospace; font-size: 2rem; margin-bottom: 30px; color: var(--accent);">
                    카드 제출 현황
                </h2>
                <div class="submission-grid" id="submissionGrid"></div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="revealCards()" id="revealButton" disabled>
                        <span>결과 공개</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Phase -->
        <div id="resultsScreen" class="screen">
            <div class="results-panel">
                <div class="scoreboard">
                    <div class="scoreboard-title">라운드 결과</div>
                    <div class="scores-grid" id="resultScores"></div>
                </div>

                <h2 style="text-align: center; font-family: 'Orbitron', monospace; font-size: 2rem; margin: 30px 0; color: var(--accent);">
                    매치 결과
                </h2>
                <div class="matches-grid" id="matchesGrid"></div>

                <div class="action-buttons" style="margin-top: 30px;">
                    <button class="btn btn-primary" onclick="nextRound()">
                        <span id="nextButtonText">다음 라운드</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCC0wATHn9czB7bwCn5RijT5zHpRF9_xS8",
            authDomain: "mw-game-954a8.firebaseapp.com",
            databaseURL: "https://mw-game-954a8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mw-game-954a8",
            storageBucket: "mw-game-954a8.firebasestorage.app",
            messagingSenderId: "768733083712",
            appId: "1:768733083712:web:7f194e8a59514eb74447a5"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        // Expose to global scope
        window.database = database;
        window.ref = ref;
        window.onValue = onValue;
        window.update = update;
        window.set = set;
        
        // Signal that Firebase is ready
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        
        let roomData = null;
        let currentPhase = 'discussion'; // discussion, submission, results
        let timerInterval = null;
        let timeLeft = 0;

        function init() {
            if (!roomCode) {
                alert('방 코드가 없습니다');
                window.location.href = 'index.html';
                return;
            }

            listenToRoom();
        }

        function listenToRoom() {
            const roomRef = window.ref(window.database, 'rooms/' + roomCode);
            window.onValue(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    roomData = snapshot.val();
                    updateGameState();
                }
            });
        }

        function updateGameState() {
            document.getElementById('currentRound').textContent = roomData.currentRound || 1;
            document.getElementById('totalRounds').textContent = roomData.totalRounds || 9;

            if (!roomData.gamePhase || roomData.gamePhase === 'discussion') {
                startDiscussionPhase();
            } else if (roomData.gamePhase === 'submission') {
                startSubmissionPhase();
            } else if (roomData.gamePhase === 'results') {
                showResults();
            }
        }

        function startDiscussionPhase() {
            currentPhase = 'discussion';
            showScreen('discussionScreen');
            document.getElementById('phaseIndicator').textContent = '회의 대기';
            
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer').textContent = '--:--';
            
            // Show start button
            document.getElementById('startRoundButton').style.display = 'inline-block';
        }

        function startDiscussionTimer() {
            document.getElementById('startRoundButton').style.display = 'none';
            document.getElementById('skipToSubmitButton').style.display = 'inline-block';
            document.getElementById('phaseIndicator').textContent = '회의 중';
            
            console.log('Discussion timer starting, roomData:', roomData);
            console.log('Discussion time:', roomData.discussionTime);
            
            // Set flag in Firebase so players know discussion has started
            window.update(window.ref(window.database, 'rooms/' + roomCode), {
                discussionStarted: true
            });
            
            timeLeft = roomData.discussionTime;
            console.log('timeLeft set to:', timeLeft);
            startTimer(() => {
                // Move to submission phase automatically when time ends
                skipToSubmission();
            });
        }

        function skipToSubmission() {
            if (timerInterval) clearInterval(timerInterval);
            
            // Move to submission phase
            window.update(window.ref(window.database, 'rooms/' + roomCode), {
                gamePhase: 'submission',
                discussionStarted: false
            });
        }

        function startSubmissionPhase() {
            currentPhase = 'submission';
            showScreen('submissionScreen');
            document.getElementById('phaseIndicator').textContent = '카드 제출 중';
            
            updateScoreboard('currentScores');
            
            // Listen to submissions in real-time
            const submissionsRef = window.ref(window.database, 'rooms/' + roomCode + '/submissions');
            window.onValue(submissionsRef, (snapshot) => {
                updateSubmissionGrid();
            });
            
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = roomData.submitTime;
            startTimer(() => {
                // Auto reveal if time's up
                document.getElementById('revealButton').disabled = false;
            });
        }

        function updateSubmissionGrid() {
            const grid = document.getElementById('submissionGrid');
            grid.innerHTML = '';

            const submissions = roomData.submissions || {};
            const currentRound = roomData.currentRound || 1;

            for (let i = 1; i <= roomData.teamCount; i++) {
                const card = document.createElement('div');
                card.className = 'submission-card';
                
                const teamSubmission = Object.values(submissions).find(s => s.teamNumber === i && s.round === currentRound);
                const hasSubmitted = !!teamSubmission;

                if (hasSubmitted) {
                    card.classList.add('submitted');
                }

                card.innerHTML = `
                    <div class="submission-team">팀 ${i}</div>
                    <div class="submission-status">${hasSubmitted ? '제출 완료 ✓' : '대기 중...'}</div>
                `;

                grid.appendChild(card);
            }

            // Check if all teams submitted
            const allSubmitted = Object.values(submissions).filter(s => s.round === currentRound).length === roomData.teamCount;
            document.getElementById('revealButton').disabled = !allSubmitted;
        }

        function updateScoreboard(elementId) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';

            const scores = roomData.scores || {};
            const maxScore = Math.max(...Object.values(scores));

            for (let i = 1; i <= roomData.teamCount; i++) {
                const teamKey = `team${i}`;
                const score = scores[teamKey] || 0;
                
                const item = document.createElement('div');
                item.className = 'score-item';
                if (score === maxScore && score > 0) {
                    item.classList.add('leader');
                }

                item.innerHTML = `
                    <div class="score-team">팀 ${i}</div>
                    <div class="score-value">${score}</div>
                `;

                grid.appendChild(item);
            }
        }

        function revealCards() {
            window.update(window.ref(window.database, 'rooms/' + roomCode), {
                gamePhase: 'results'
            });
        }

        function showResults() {
            // Prevent multiple calls
            if (currentPhase === 'results') {
                console.log('Already in results phase, skipping');
                return;
            }
            
            currentPhase = 'results';
            showScreen('resultsScreen');
            document.getElementById('phaseIndicator').textContent = '결과 확인';
            
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer').textContent = '--:--';

            console.log('Showing results...');
            calculateResults();
            displayMatches();
            updateScoreboard('resultScores');

            // Update next button text
            const currentRound = roomData.currentRound || 1;
            if (currentRound >= (roomData.totalRounds || 9)) {
                document.getElementById('nextButtonText').textContent = '최종 결과 보기';
            }
        }

        function calculateResults() {
            const submissions = roomData.submissions || {};
            const currentRound = roomData.currentRound || 1;
            const scores = { ...roomData.scores };

            console.log('=== Calculate Results ===');
            console.log('Current round:', currentRound);
            console.log('All submissions:', submissions);
            console.log('Current scores before:', scores);

            // Get submissions for current round
            const roundSubmissions = Object.values(submissions).filter(s => s.round === currentRound);
            console.log('Round submissions:', roundSubmissions);

            // Create matches (team1 vs team2, team3 vs team4, etc.)
            for (let i = 0; i < roomData.teamCount; i += 2) {
                const team1 = i + 1;
                const team2 = i + 2;

                const sub1 = roundSubmissions.find(s => s.teamNumber === team1);
                const sub2 = roundSubmissions.find(s => s.teamNumber === team2);

                console.log(`Match: Team ${team1} vs Team ${team2}`);
                console.log('Sub1:', sub1);
                console.log('Sub2:', sub2);

                if (sub1 && sub2) {
                    const card1 = sub1.card;
                    const card2 = sub2.card;

                    console.log(`Cards: ${card1} vs ${card2}`);

                    // Calculate scores based on game rules
                    if (card1 === 'M' && card2 === 'M') {
                        scores[`team${team1}`] -= 3;
                        scores[`team${team2}`] -= 3;
                        console.log('Result: Both -3');
                    } else if (card1 === 'M' && card2 === 'W') {
                        scores[`team${team1}`] += 6;
                        scores[`team${team2}`] -= 6;
                        console.log('Result: Team1 +6, Team2 -6');
                    } else if (card1 === 'W' && card2 === 'M') {
                        scores[`team${team1}`] -= 6;
                        scores[`team${team2}`] += 6;
                        console.log('Result: Team1 -6, Team2 +6');
                    } else if (card1 === 'W' && card2 === 'W') {
                        scores[`team${team1}`] += 3;
                        scores[`team${team2}`] += 3;
                        console.log('Result: Both +3');
                    }
                }
            }

            console.log('Final scores:', scores);

            // Update scores in Firebase
            window.update(window.ref(window.database, 'rooms/' + roomCode), {
                scores: scores
            });
        }

        function displayMatches() {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = '';

            const submissions = roomData.submissions || {};
            const currentRound = roomData.currentRound || 1;
            const roundSubmissions = Object.values(submissions).filter(s => s.round === currentRound);

            for (let i = 0; i < roomData.teamCount; i += 2) {
                const team1 = i + 1;
                const team2 = i + 2;

                const sub1 = roundSubmissions.find(s => s.teamNumber === team1);
                const sub2 = roundSubmissions.find(s => s.teamNumber === team2);

                if (sub1 && sub2) {
                    const card1 = sub1.card;
                    const card2 = sub2.card;

                    let score1 = 0, score2 = 0;

                    if (card1 === 'M' && card2 === 'M') {
                        score1 = -3; score2 = -3;
                    } else if (card1 === 'M' && card2 === 'W') {
                        score1 = 6; score2 = -6;
                    } else if (card1 === 'W' && card2 === 'M') {
                        score1 = -6; score2 = 6;
                    } else if (card1 === 'W' && card2 === 'W') {
                        score1 = 3; score2 = 3;
                    }

                    const matchCard = document.createElement('div');
                    matchCard.className = 'match-card';
                    matchCard.innerHTML = `
                        <div class="team-result">
                            <div class="team-name">팀 ${team1}</div>
                            <div class="card-display ${card1.toLowerCase()}-card">${card1}</div>
                            <div class="score-change ${score1 >= 0 ? 'positive' : 'negative'}">${score1 >= 0 ? '+' : ''}${score1}</div>
                        </div>
                        <div class="vs-divider">VS</div>
                        <div class="team-result">
                            <div class="team-name">팀 ${team2}</div>
                            <div class="card-display ${card2.toLowerCase()}-card">${card2}</div>
                            <div class="score-change ${score2 >= 0 ? 'positive' : 'negative'}">${score2 >= 0 ? '+' : ''}${score2}</div>
                        </div>
                    `;

                    grid.appendChild(matchCard);
                }
            }
        }

        function nextRound() {
            const currentRound = roomData.currentRound || 1;

            if (currentRound >= (roomData.totalRounds || 9)) {
                // Update Firebase to show final results for all players
                window.update(window.ref(window.database, 'rooms/' + roomCode), {
                    status: 'finished',
                    gamePhase: 'finalResults'
                }).then(() => {
                    // Go to final results
                    window.location.href = `result.html?room=${roomCode}`;
                });
            } else {
                // Start next round and clear submissions
                window.update(window.ref(window.database, 'rooms/' + roomCode), {
                    currentRound: currentRound + 1,
                    gamePhase: 'discussion',
                    submissions: {} // Clear submissions for new round
                });
            }
        }

        function startTimer(onComplete) {
            const timerElement = document.getElementById('timer');
            
            console.log('startTimer called, timeLeft:', timeLeft);
            
            // 즉시 타이머 표시
            const initialMinutes = Math.floor(timeLeft / 60);
            const initialSeconds = timeLeft % 60;
            const displayText = `${String(initialMinutes).padStart(2, '0')}:${String(initialSeconds).padStart(2, '0')}`;
            timerElement.textContent = displayText;
            console.log('Timer display set to:', displayText);
            
            timerInterval = setInterval(() => {
                timeLeft--;

                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (timeLeft <= 10 && timeLeft > 0) {
                    timerElement.classList.add('warning');
                } else {
                    timerElement.classList.remove('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.classList.remove('warning');
                    console.log('Timer completed');
                    if (onComplete) onComplete();
                }
            }, 1000);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.revealCards = revealCards;
        window.nextRound = nextRound;
        window.startDiscussionTimer = startDiscussionTimer;
        window.skipToSubmission = skipToSubmission;

        // Wait for Firebase to be ready
        if (window.firebaseReady) {
            init();
        } else {
            window.addEventListener('firebaseReady', init);
        }
    </script>
</body>
</html>
