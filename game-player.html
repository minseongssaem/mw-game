<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME - 참가자</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --m-glow: #ff1744;
            --w-color: #00d9ff;
            --w-glow: #00bcd4;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-mid);
            border-radius: 12px;
        }

        .my-team {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .round-info {
            font-size: 1.3rem;
            color: var(--text-secondary);
        }

        .timer {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            color: var(--w-color);
            text-shadow: 0 0 30px var(--w-glow);
            margin: 30px 0;
        }

        .timer.warning {
            color: var(--m-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Discussion Phase */
        .discussion-panel {
            text-align: center;
            padding: 60px 20px;
        }

        .discussion-title {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--m-color), var(--w-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .discussion-message {
            font-size: 1.5rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        /* Card Selection Phase */
        .card-selection-panel {
            text-align: center;
            padding: 40px 20px;
        }

        .selection-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            margin-bottom: 40px;
            color: var(--accent);
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .card-option {
            width: 200px;
            height: 280px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 8rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 4px solid transparent;
            position: relative;
        }

        .card-option::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            padding: 4px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card-option:hover::before {
            opacity: 1;
        }

        .card-option:hover {
            transform: translateY(-20px) scale(1.05);
        }

        .card-option.selected {
            border-color: var(--accent);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
            transform: translateY(-20px) scale(1.05);
        }

        .m-card {
            background: var(--m-color);
            color: white;
            box-shadow: 0 20px 60px rgba(255, 51, 102, 0.5);
        }

        .w-card {
            background: var(--w-color);
            color: var(--bg-dark);
            box-shadow: 0 20px 60px rgba(0, 217, 255, 0.5);
        }

        .card-info {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .card-info-title {
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 15px;
            text-align: center;
        }

        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .rule-item {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .rule-match {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .rule-result {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .rule-result.positive {
            color: var(--w-color);
        }

        .rule-result.negative {
            color: var(--m-color);
        }

        .btn {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 25px 60px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--m-color) 0%, var(--w-color) 100%);
            color: white;
            box-shadow: 
                0 6px 30px rgba(255, 51, 102, 0.4),
                0 6px 30px rgba(0, 217, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 10px 40px rgba(255, 51, 102, 0.5),
                0 10px 40px rgba(0, 217, 255, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Waiting Phase */
        .waiting-panel {
            text-align: center;
            padding: 60px 20px;
        }

        .waiting-icon {
            font-size: 5rem;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .waiting-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--w-color);
        }

        .waiting-message {
            font-size: 1.3rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .submitted-card-display {
            width: 150px;
            height: 210px;
            margin: 30px auto;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 6rem;
            font-weight: 900;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Results Phase */
        .results-panel {
            padding: 40px 20px;
        }

        .my-result {
            background: var(--bg-mid);
            border: 3px solid var(--accent);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .result-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 30px;
        }

        .result-cards {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .result-card-display {
            width: 120px;
            height: 170px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 5rem;
            font-weight: 900;
        }

        .vs-text {
            font-size: 2rem;
            color: var(--text-secondary);
        }

        .result-score {
            font-size: 3rem;
            font-weight: 900;
            margin-top: 20px;
        }

        .result-score.positive {
            color: var(--w-color);
        }

        .result-score.negative {
            color: var(--m-color);
        }

        .scoreboard {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 30px;
        }

        .scoreboard-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .score-item {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid var(--text-secondary);
        }

        .score-item.my-team {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .score-team {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .score-item.my-team .score-team {
            color: var(--accent);
        }

        .score-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--w-color);
        }

        @media (max-width: 768px) {
            .card-option {
                width: 150px;
                height: 210px;
                font-size: 6rem;
            }

            .cards-container {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="my-team">팀 <span id="myTeamNumber">-</span></div>
            <div class="round-info">라운드 <span id="currentRound">1</span> / <span id="totalRounds">9</span></div>
        </div>

        <div class="timer" id="timer">00:00</div>

        <!-- Discussion Phase -->
        <div id="discussionScreen" class="screen active">
            <div class="discussion-panel">
                <div class="discussion-title">회의 시간</div>
                <div class="discussion-message" id="discussionMessage">
                    진행자가 라운드를 시작하기를 기다리는 중...<br>
                    <span class="waiting-animation">⏳</span>
                </div>
                
                <!-- 게임 규칙 표시 -->
                <div class="card-info" style="margin-top: 40px;">
                    <div class="card-info-title">게임 규칙</div>
                    <div class="rules-grid">
                        <div class="rule-item">
                            <div class="rule-match">M vs M</div>
                            <div class="rule-result"><span style="color: var(--m-color);">-3점</span> / <span style="color: var(--m-color);">-3점</span></div>
                        </div>
                        <div class="rule-item">
                            <div class="rule-match">M vs W</div>
                            <div class="rule-result"><span style="color: var(--w-color);">+6점</span> / <span style="color: var(--m-color);">-6점</span></div>
                        </div>
                        <div class="rule-item">
                            <div class="rule-match">W vs M</div>
                            <div class="rule-result"><span style="color: var(--m-color);">-6점</span> / <span style="color: var(--w-color);">+6점</span></div>
                        </div>
                        <div class="rule-item">
                            <div class="rule-match">W vs W</div>
                            <div class="rule-result"><span style="color: var(--w-color);">+3점</span> / <span style="color: var(--w-color);">+3점</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card Selection Phase -->
        <div id="selectionScreen" class="screen">
            <div class="card-selection-panel">
                <div class="selection-title">카드를 선택하세요</div>

                <div class="card-info">
                    <div class="card-info-title">게임 규칙</div>
                    <div class="rules-grid">
                        <div class="rule-item">
                            <div class="rule-match">M vs M</div>
                            <div class="rule-result"><span style="color: var(--m-color);">-3점</span> / <span style="color: var(--m-color);">-3점</span></div>
                        </div>
                        <div class="rule-item">
                            <div class="rule-match">M vs W</div>
                            <div class="rule-result"><span style="color: var(--w-color);">+6점</span> / <span style="color: var(--m-color);">-6점</span></div>
                        </div>
                        <div class="rule-item">
                            <div class="rule-match">W vs M</div>
                            <div class="rule-result"><span style="color: var(--m-color);">-6점</span> / <span style="color: var(--w-color);">+6점</span></div>
                        </div>
                        <div class="rule-item">
                            <div class="rule-match">W vs W</div>
                            <div class="rule-result"><span style="color: var(--w-color);">+3점</span> / <span style="color: var(--w-color);">+3점</span></div>
                        </div>
                    </div>
                </div>

                <div class="cards-container">
                    <div class="card-option m-card" onclick="selectCard('M')">
                        M
                    </div>
                    <div class="card-option w-card" onclick="selectCard('W')">
                        W
                    </div>
                </div>

                <button class="btn btn-primary" onclick="submitCard()" id="submitButton" disabled>
                    제출하기
                </button>
            </div>
        </div>

        <!-- Waiting Phase -->
        <div id="waitingScreen" class="screen">
            <div class="waiting-panel">
                <div class="waiting-icon">⏳</div>
                <div class="waiting-title">제출 완료!</div>
                <div class="waiting-message">
                    선택한 카드:
                </div>
                <div class="submitted-card-display" id="submittedCardDisplay"></div>
                <div class="waiting-message">
                    다른 팀의 제출을 기다리는 중...
                </div>
            </div>
        </div>

        <!-- Results Phase -->
        <div id="resultsScreen" class="screen">
            <div class="results-panel">
                <div class="my-result">
                    <div class="result-title">라운드 결과</div>
                    <div class="result-cards" id="resultCards"></div>
                    <div class="result-score" id="resultScore"></div>
                </div>

                <div class="scoreboard">
                    <div class="scoreboard-title">전체 점수</div>
                    <div class="scores-grid" id="scoresGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCC0wATHn9czB7bwCn5RijT5zHpRF9_xS8",
            authDomain: "mw-game-954a8.firebaseapp.com",
            databaseURL: "https://mw-game-954a8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mw-game-954a8",
            storageBucket: "mw-game-954a8.firebasestorage.app",
            messagingSenderId: "768733083712",
            appId: "1:768733083712:web:7f194e8a59514eb74447a5"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.database = database;
        window.ref = ref;
        window.onValue = onValue;
        window.push = push;
        window.set = set;
        
        // Signal that Firebase is ready
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        const myTeam = parseInt(urlParams.get('team'));
        
        let roomData = null;
        let selectedCard = null;
        let hasSubmitted = false;
        let timerInterval = null;
        let timeLeft = 0;

        function init() {
            if (!roomCode || !myTeam) {
                alert('잘못된 접근입니다');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('myTeamNumber').textContent = myTeam;
            listenToRoom();
        }

        function listenToRoom() {
            const roomRef = window.ref(window.database, 'rooms/' + roomCode);
            window.onValue(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    roomData = snapshot.val();
                    updateGameState();
                }
            });
        }

        function updateGameState() {
            document.getElementById('currentRound').textContent = roomData.currentRound || 1;
            document.getElementById('totalRounds').textContent = roomData.totalRounds || 9;

            // Check if game is finished
            if (roomData.status === 'finished' || roomData.gamePhase === 'finalResults') {
                window.location.href = `result.html?room=${roomCode}&team=${myTeam}`;
                return;
            }

            if (roomData.gamePhase === 'discussion') {
                startDiscussionPhase();
            } else if (roomData.gamePhase === 'submission') {
                startSubmissionPhase();
            } else if (roomData.gamePhase === 'results') {
                showResults();
            }
        }

        function startDiscussionPhase() {
            showScreen('discussionScreen');
            hasSubmitted = false;
            selectedCard = null;
            
            // Check if discussion timer has started
            if (roomData.discussionStarted) {
                document.getElementById('discussionMessage').innerHTML = `
                    팀원들과 전략을 논의하세요<br>
                    M 또는 W 카드 중 무엇을 낼지 결정하세요
                `;
                
                if (timerInterval) clearInterval(timerInterval);
                timeLeft = roomData.discussionTime;
                startTimer();
            } else {
                document.getElementById('discussionMessage').innerHTML = `
                    진행자가 라운드를 시작하기를 기다리는 중...<br>
                    <span class="waiting-animation">⏳</span>
                `;
                
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('timer').textContent = '--:--';
            }
        }

        function startSubmissionPhase() {
            if (hasSubmitted) {
                showScreen('waitingScreen');
            } else {
                showScreen('selectionScreen');
            }
            
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = roomData.submitTime;
            startTimer();
        }

        function selectCard(card) {
            if (hasSubmitted) return;

            selectedCard = card;
            document.querySelectorAll('.card-option').forEach(c => c.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('submitButton').disabled = false;
        }

        function submitCard() {
            if (!selectedCard || hasSubmitted) return;

            const submissionRef = window.push(window.ref(window.database, 'rooms/' + roomCode + '/submissions'));
            window.set(submissionRef, {
                teamNumber: myTeam,
                card: selectedCard,
                round: roomData.currentRound,
                timestamp: Date.now()
            });

            hasSubmitted = true;

            // Show waiting screen
            const cardDisplay = document.getElementById('submittedCardDisplay');
            cardDisplay.className = `submitted-card-display ${selectedCard.toLowerCase()}-card`;
            cardDisplay.textContent = selectedCard;
            cardDisplay.style.background = selectedCard === 'M' ? 'var(--m-color)' : 'var(--w-color)';
            cardDisplay.style.color = selectedCard === 'M' ? 'white' : 'var(--bg-dark)';

            showScreen('waitingScreen');
        }

        function showResults() {
            showScreen('resultsScreen');
            
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer').textContent = '--:--';

            displayMyResult();
            displayScoreboard();
        }

        function displayMyResult() {
            const submissions = roomData.submissions || {};
            const currentRound = roomData.currentRound || 1;
            
            // Find my submission and opponent's submission
            const mySubmission = Object.values(submissions).find(s => s.teamNumber === myTeam && s.round === currentRound);
            
            // Determine opponent (odd teams play with even teams)
            const opponentTeam = myTeam % 2 === 0 ? myTeam - 1 : myTeam + 1;
            const opponentSubmission = Object.values(submissions).find(s => s.teamNumber === opponentTeam && s.round === currentRound);

            if (mySubmission && opponentSubmission) {
                const myCard = mySubmission.card;
                const oppCard = opponentSubmission.card;

                // Display cards
                const resultCards = document.getElementById('resultCards');
                resultCards.innerHTML = `
                    <div>
                        <div class="result-card-display ${myCard.toLowerCase()}-card" style="background: ${myCard === 'M' ? 'var(--m-color)' : 'var(--w-color)'}; color: ${myCard === 'M' ? 'white' : 'var(--bg-dark)'}">${myCard}</div>
                        <div style="margin-top: 10px; color: var(--accent);">내 카드</div>
                    </div>
                    <div class="vs-text">VS</div>
                    <div>
                        <div class="result-card-display ${oppCard.toLowerCase()}-card" style="background: ${oppCard === 'M' ? 'var(--m-color)' : 'var(--w-color)'}; color: ${oppCard === 'M' ? 'white' : 'var(--bg-dark)'}">${oppCard}</div>
                        <div style="margin-top: 10px; color: var(--text-secondary);">상대 카드</div>
                    </div>
                `;

                // Calculate score
                let myScore = 0;
                if (myCard === 'M' && oppCard === 'M') myScore = -3;
                else if (myCard === 'M' && oppCard === 'W') myScore = 6;
                else if (myCard === 'W' && oppCard === 'M') myScore = -6;
                else if (myCard === 'W' && oppCard === 'W') myScore = 3;

                const resultScore = document.getElementById('resultScore');
                resultScore.textContent = `${myScore >= 0 ? '+' : ''}${myScore}점`;
                resultScore.className = `result-score ${myScore >= 0 ? 'positive' : 'negative'}`;
            }
        }

        function displayScoreboard() {
            const grid = document.getElementById('scoresGrid');
            grid.innerHTML = '';

            const scores = roomData.scores || {};

            for (let i = 1; i <= roomData.teamCount; i++) {
                const teamKey = `team${i}`;
                const score = scores[teamKey] || 0;
                
                const item = document.createElement('div');
                item.className = 'score-item';
                if (i === myTeam) {
                    item.classList.add('my-team');
                }

                item.innerHTML = `
                    <div class="score-team">팀 ${i}</div>
                    <div class="score-value">${score}</div>
                `;

                grid.appendChild(item);
            }
        }

        function startTimer() {
            const timerElement = document.getElementById('timer');
            
            // 즉시 타이머 표시
            const initialMinutes = Math.floor(timeLeft / 60);
            const initialSeconds = timeLeft % 60;
            timerElement.textContent = `${String(initialMinutes).padStart(2, '0')}:${String(initialSeconds).padStart(2, '0')}`;
            
            timerInterval = setInterval(() => {
                timeLeft--;

                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (timeLeft <= 10 && timeLeft > 0) {
                    timerElement.classList.add('warning');
                } else {
                    timerElement.classList.remove('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.classList.remove('warning');
                }
            }, 1000);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.selectCard = selectCard;
        window.submitCard = submitCard;

        // Wait for Firebase to be ready
        if (window.firebaseReady) {
            init();
        } else {
            window.addEventListener('firebaseReady', init);
        }
    </script>
</body>
</html>
