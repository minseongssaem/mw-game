<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME - 진행자</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --m-glow: #ff1744;
            --w-color: #00d9ff;
            --w-glow: #00bcd4;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .subtitle {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .btn {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 20px 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--m-color) 0%, var(--w-color) 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(255, 51, 102, 0.3),
                0 4px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 30px rgba(255, 51, 102, 0.4),
                0 6px 30px rgba(0, 217, 255, 0.4);
        }

        .settings-panel {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .setting-group {
            margin-bottom: 30px;
        }

        .setting-label {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .setting-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .option-btn {
            padding: 12px;
            background: var(--bg-light);
            border: 2px solid var(--text-secondary);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--w-color);
            background: rgba(0, 217, 255, 0.1);
        }

        .option-btn.selected {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .room-code-display {
            background: var(--bg-dark);
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin: 30px 0;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .room-code-label {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.2em;
        }

        .room-code {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 0.3em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .back-btn:hover {
            color: var(--w-color);
            transform: translateX(-5px);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        @media (max-width: 768px) {
            .settings-panel {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Host Setup Screen -->
        <div id="hostSetupScreen" class="screen active">
            <button class="back-btn" onclick="location.href='index.html'">←</button>
            
            <div class="header">
                <div class="subtitle">진행자 설정</div>
            </div>

            <div class="settings-panel">
                <div class="setting-group">
                    <label class="setting-label">참가 팀 수 (짝수)</label>
                    <div class="setting-options" style="grid-template-columns: repeat(5, 1fr);">
                        <button class="option-btn" onclick="selectTeamCount(2)">2</button>
                        <button class="option-btn" onclick="selectTeamCount(4)">4</button>
                        <button class="option-btn" onclick="selectTeamCount(6)">6</button>
                        <button class="option-btn" onclick="selectTeamCount(8)">8</button>
                        <button class="option-btn" onclick="selectTeamCount(10)">10</button>
                        <button class="option-btn" onclick="selectTeamCount(12)">12</button>
                        <button class="option-btn" onclick="selectTeamCount(14)">14</button>
                        <button class="option-btn" onclick="selectTeamCount(16)">16</button>
                        <button class="option-btn" onclick="selectTeamCount(18)">18</button>
                        <button class="option-btn" onclick="selectTeamCount(20)">20</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">총 라운드 수</label>
                    <div class="setting-options">
                        <button class="option-btn" onclick="selectTotalRounds(6)">6라운드</button>
                        <button class="option-btn" onclick="selectTotalRounds(9)">9라운드</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">회의 시간</label>
                    <div class="setting-options">
                        <button class="option-btn" onclick="selectDiscussionTime(60)">1분</button>
                        <button class="option-btn" onclick="selectDiscussionTime(120)">2분</button>
                        <button class="option-btn" onclick="selectDiscussionTime(180)">3분</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">카드 제출 시간</label>
                    <div class="setting-options">
                        <button class="option-btn" onclick="selectSubmitTime(30)">30초</button>
                        <button class="option-btn" onclick="selectSubmitTime(60)">1분</button>
                        <button class="option-btn" onclick="selectSubmitTime(90)">1분 30초</button>
                        <button class="option-btn" onclick="selectSubmitTime(120)">2분</button>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="createRoom()" style="width: 100%; margin-top: 30px;">
                    <span>방 개설하기</span>
                </button>
            </div>
        </div>

        <!-- Room Created Screen -->
        <div id="roomCreatedScreen" class="screen">
            <button class="back-btn" onclick="showHostSetup()">←</button>
            
            <div class="header">
                <div class="subtitle">방이 생성되었습니다</div>
            </div>

            <div class="settings-panel">
                <div class="room-code-display">
                    <div class="room-code-label">ROOM CODE</div>
                    <div class="room-code" id="roomCodeDisplay">------</div>
                </div>

                <div style="text-align: center; color: var(--text-secondary); margin: 20px 0; line-height: 1.8;">
                    참가자들에게 이 코드를 공유하세요<br>
                    모든 팀이 입장하면 게임을 시작할 수 있습니다
                </div>

                <div id="joinedTeamsList" style="margin: 20px 0; padding: 20px; background: var(--bg-dark); border-radius: 8px;">
                    <div style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 10px;">입장한 팀:</div>
                    <div id="teamsList" style="color: var(--accent); font-size: 1.1rem;"></div>
                </div>

                <button class="btn btn-primary" onclick="startGame()" style="width: 100%; margin-top: 20px;">
                    <span>게임 시작</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCC0wATHn9czB7bwCn5RijT5zHpRF9_xS8",
            authDomain: "mw-game-954a8.firebaseapp.com",
            databaseURL: "https://mw-game-954a8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mw-game-954a8",
            storageBucket: "mw-game-954a8.firebasestorage.app",
            messagingSenderId: "768733083712",
            appId: "1:768733083712:web:7f194e8a59514eb74447a5"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        // Store in window for global access
        window.database = database;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbUpdate = update;
        
        console.log("Firebase initialized!");
    </script>

    <script>
        let gameState = {
            teamCount: null,
            totalRounds: 9, // 기본값 9라운드
            discussionTime: null,
            submitTime: null,
            roomCode: null,
            currentRound: 1,
            scores: {}
        };

        function selectTeamCount(count) {
            gameState.teamCount = count;
            document.querySelectorAll('#hostSetupScreen .setting-group:first-child .option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function selectTotalRounds(rounds) {
            gameState.totalRounds = rounds;
            document.querySelectorAll('#hostSetupScreen .setting-group:nth-child(2) .option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function selectDiscussionTime(seconds) {
            gameState.discussionTime = seconds;
            document.querySelectorAll('#hostSetupScreen .setting-group:nth-child(3) .option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function selectSubmitTime(seconds) {
            gameState.submitTime = seconds;
            document.querySelectorAll('#hostSetupScreen .setting-group:nth-child(4) .option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function createRoom() {
            if (!gameState.teamCount || !gameState.discussionTime || !gameState.submitTime) {
                alert('모든 설정을 선택해주세요');
                return;
            }

            gameState.roomCode = generateRoomCode();
            
            // Initialize scores
            for (let i = 1; i <= gameState.teamCount; i++) {
                gameState.scores[`team${i}`] = 0;
            }

            // Save to Firebase
            try {
                const roomRef = window.dbRef(window.database, 'rooms/' + gameState.roomCode);
                await window.dbSet(roomRef, {
                    teamCount: gameState.teamCount,
                    totalRounds: gameState.totalRounds,
                    discussionTime: gameState.discussionTime,
                    submitTime: gameState.submitTime,
                    currentRound: 1,
                    status: 'waiting',
                    scores: gameState.scores,
                    teams: {},
                    createdAt: Date.now()
                });

                console.log('Room created:', gameState.roomCode);
                document.getElementById('roomCodeDisplay').textContent = gameState.roomCode;
                
                // Listen for team joins
                listenForTeamJoins();
                
                showRoomCreated();
            } catch (error) {
                console.error('Error creating room:', error);
                alert('방 생성 중 오류가 발생했습니다: ' + error.message);
            }
        }

        function listenForTeamJoins() {
            const teamsRef = window.dbRef(window.database, 'rooms/' + gameState.roomCode + '/teams');
            window.dbOnValue(teamsRef, (snapshot) => {
                const teams = snapshot.val();
                const teamsList = document.getElementById('teamsList');
                
                if (teams) {
                    const joinedTeams = Object.keys(teams).map(key => teams[key].teamNumber);
                    teamsList.textContent = joinedTeams.length > 0 
                        ? '팀 ' + joinedTeams.sort((a,b) => a-b).join(', 팀 ')
                        : '아직 입장한 팀이 없습니다';
                } else {
                    teamsList.textContent = '아직 입장한 팀이 없습니다';
                }
            });
        }

        function showHostSetup() {
            document.getElementById('roomCreatedScreen').classList.remove('active');
            document.getElementById('hostSetupScreen').classList.add('active');
        }

        function showRoomCreated() {
            document.getElementById('hostSetupScreen').classList.remove('active');
            document.getElementById('roomCreatedScreen').classList.add('active');
        }

        function startGame() {
            window.location.href = `waiting-room.html?room=${gameState.roomCode}&mode=host`;
        }
    </script>
</body>
</html>
