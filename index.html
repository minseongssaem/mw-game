<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --m-glow: #ff1744;
            --w-color: #00d9ff;
            --w-glow: #00bcd4;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .logo .m-letter {
            color: var(--m-color);
            text-shadow: 
                0 0 20px var(--m-glow),
                0 0 40px var(--m-glow),
                0 0 60px rgba(255, 51, 102, 0.5);
            animation: pulseM 3s ease-in-out infinite;
        }

        .logo .w-letter {
            color: var(--w-color);
            text-shadow: 
                0 0 20px var(--w-glow),
                0 0 40px var(--w-glow),
                0 0 60px rgba(0, 217, 255, 0.5);
            animation: pulseW 3s ease-in-out infinite;
        }

        @keyframes pulseM {
            0%, 100% { 
                text-shadow: 
                    0 0 20px var(--m-glow),
                    0 0 40px var(--m-glow),
                    0 0 60px rgba(255, 51, 102, 0.5);
            }
            50% { 
                text-shadow: 
                    0 0 30px var(--m-glow),
                    0 0 60px var(--m-glow),
                    0 0 80px rgba(255, 51, 102, 0.7);
            }
        }

        @keyframes pulseW {
            0%, 100% { 
                text-shadow: 
                    0 0 20px var(--w-glow),
                    0 0 40px var(--w-glow),
                    0 0 60px rgba(0, 217, 255, 0.5);
            }
            50% { 
                text-shadow: 
                    0 0 30px var(--w-glow),
                    0 0 60px var(--w-glow),
                    0 0 80px rgba(0, 217, 255, 0.7);
            }
        }

        .subtitle {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .mode-card {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.03) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mode-card:hover::before {
            opacity: 1;
        }

        .mode-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.2);
        }

        .mode-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .mode-title {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 0.05em;
        }

        .mode-desc {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
            }
            
            .mode-selection {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="m-letter">M</span><span class="w-letter">W</span>
            </div>
            <div class="subtitle">Strategy Game</div>
        </div>
        
        <div style="text-align: center; margin-bottom: 30px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <button onclick="location.href='login.html?mode=admin'" style="background: linear-gradient(135deg, var(--accent) 0%, #ffed4e 100%); border: none; color: var(--bg-dark); padding: 12px 35px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-family: 'Noto Sans KR', sans-serif; font-weight: 900; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);">
                👑 관리자 로그인
            </button>
        </div>
        
        <div class="mode-selection">
            <div class="mode-card" onclick="location.href='login.html?mode=host'">
                <div class="mode-icon">🎮</div>
                <div class="mode-title">진행자</div>
                <div class="mode-desc">게임을 생성하고 진행합니다<br><small style="color: var(--accent);">로그인 필요</small></div>
            </div>
            
            <div class="mode-card" onclick="location.href='player.html'">
                <div class="mode-icon">🎯</div>
                <div class="mode-title">참가자</div>
                <div class="mode-desc">방 코드로 게임에 참가합니다</div>
            </div>
        </div>
    </div>

        }

</body>
</html>
