<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME - 최종 결과</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --m-glow: #ff1744;
            --w-color: #00d9ff;
            --w-glow: #00bcd4;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }

        .logo .m-letter {
            color: var(--m-color);
            text-shadow: 0 0 40px var(--m-glow);
            animation: pulseM 3s ease-in-out infinite;
        }

        .logo .w-letter {
            color: var(--w-color);
            text-shadow: 0 0 40px var(--w-glow);
            animation: pulseW 3s ease-in-out infinite;
        }

        @keyframes pulseM {
            0%, 100% { text-shadow: 0 0 20px var(--m-glow); }
            50% { text-shadow: 0 0 60px var(--m-glow); }
        }

        @keyframes pulseW {
            0%, 100% { text-shadow: 0 0 20px var(--w-glow); }
            50% { text-shadow: 0 0 60px var(--w-glow); }
        }

        .subtitle {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.5rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .winner-announcement {
            text-align: center;
            margin-bottom: 60px;
            padding: 60px 40px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border: 3px solid var(--accent);
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.6); }
        }

        .trophy {
            font-size: 8rem;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        .winner-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            letter-spacing: 0.2em;
        }

        .winner-team {
            font-family: 'Orbitron', monospace;
            font-size: clamp(4rem, 10vw, 7rem);
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            margin-bottom: 20px;
        }

        .winner-score {
            font-size: 3rem;
            color: var(--w-color);
            font-weight: 700;
        }

        .rankings {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .rankings-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 40px;
        }

        .ranking-item {
            display: grid;
            grid-template-columns: 80px 1fr 150px;
            align-items: center;
            gap: 30px;
            padding: 25px 30px;
            margin-bottom: 15px;
            background: var(--bg-dark);
            border: 2px solid var(--text-secondary);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            transform: translateX(10px);
            border-color: var(--w-color);
        }

        .ranking-item.first {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .ranking-item.second {
            border-color: #c0c0c0;
        }

        .ranking-item.third {
            border-color: #cd7f32;
        }

        .rank-number {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
        }

        .ranking-item.first .rank-number {
            color: var(--accent);
        }

        .ranking-item.second .rank-number {
            color: #c0c0c0;
        }

        .ranking-item.third .rank-number {
            color: #cd7f32;
        }

        .team-name {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
        }

        .team-score {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            text-align: right;
            color: var(--w-color);
        }

        .ranking-item.first .team-score {
            color: var(--accent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }

        .stat-label {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--w-color);
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 20px 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--m-color) 0%, var(--w-color) 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(255, 51, 102, 0.3),
                0 4px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 30px rgba(255, 51, 102, 0.4),
                0 6px 30px rgba(0, 217, 255, 0.4);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-primary);
            border: 2px solid var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--w-color);
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3);
        }

        @media (max-width: 768px) {
            .ranking-item {
                grid-template-columns: 60px 1fr 100px;
                gap: 15px;
                padding: 20px;
            }

            .rank-number {
                font-size: 2rem;
            }

            .team-name {
                font-size: 1.5rem;
            }

            .team-score {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <canvas class="fireworks" id="fireworks"></canvas>

    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="m-letter">M</span><span class="w-letter">W</span>
            </div>
            <div class="subtitle">Game Over</div>
        </div>

        <div class="winner-announcement">
            <div class="trophy">🏆</div>
            <div class="winner-title">WINNER</div>
            <div class="winner-team" id="winnerTeam">팀 -</div>
            <div class="winner-score" id="winnerScore">0점</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">총 라운드</div>
                <div class="stat-value">9</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">참가 팀</div>
                <div class="stat-value" id="totalTeams">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최고 점수</div>
                <div class="stat-value" id="highestScore">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최저 점수</div>
                <div class="stat-value" id="lowestScore">-</div>
            </div>
        </div>

        <div class="rankings">
            <div class="rankings-title">최종 순위</div>
            <div id="rankingsContainer"></div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="startNewGame()">
                새 게임 시작
            </button>
            <button class="btn btn-secondary" onclick="window.print()">
                결과 저장
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCC0wATHn9czB7bwCn5RijT5zHpRF9_xS8",
            authDomain: "mw-game-954a8.firebaseapp.com",
            databaseURL: "https://mw-game-954a8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mw-game-954a8",
            storageBucket: "mw-game-954a8.firebasestorage.app",
            messagingSenderId: "768733083712",
            appId: "1:768733083712:web:7f194e8a59514eb74447a5"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.database = database;
        window.ref = ref;
        window.onValue = onValue;
        
        // Signal that Firebase is ready
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');

        function init() {
            if (!roomCode) {
                alert('방 코드가 없습니다');
                window.location.href = 'index.html';
                return;
            }

            loadResults();
            createFireworks();
        }

        function loadResults() {
            const roomRef = window.ref(window.database, 'rooms/' + roomCode);
            window.onValue(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    const roomData = snapshot.val();
                    displayResults(roomData);
                }
            });
        }

        function displayResults(roomData) {
            console.log('=== Display Results ===');
            console.log('Room data:', roomData);
            
            const scores = roomData.scores || {};
            console.log('Scores:', scores);
            
            // Convert to array and sort
            const rankings = Object.entries(scores)
                .map(([team, score]) => ({
                    team: parseInt(team.replace('team', '')),
                    score: score
                }))
                .sort((a, b) => b.score - a.score);

            console.log('Rankings:', rankings);

            // Display winner
            if (rankings.length > 0) {
                document.getElementById('winnerTeam').textContent = `팀 ${rankings[0].team}`;
                document.getElementById('winnerScore').textContent = `${rankings[0].score}점`;
            }

            // Display stats
            document.getElementById('totalTeams').textContent = roomData.teamCount;
            document.getElementById('highestScore').textContent = rankings[0]?.score || 0;
            document.getElementById('lowestScore').textContent = rankings[rankings.length - 1]?.score || 0;

            // Display rankings
            const container = document.getElementById('rankingsContainer');
            container.innerHTML = '';

            rankings.forEach((ranking, index) => {
                const item = document.createElement('div');
                item.className = 'ranking-item';
                
                if (index === 0) item.classList.add('first');
                else if (index === 1) item.classList.add('second');
                else if (index === 2) item.classList.add('third');

                let medal = '';
                if (index === 0) medal = '🥇';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';

                item.innerHTML = `
                    <div class="rank-number">${medal || (index + 1)}</div>
                    <div class="team-name">팀 ${ranking.team}</div>
                    <div class="team-score">${ranking.score}</div>
                `;

                container.appendChild(item);
            });
        }

        function startNewGame() {
            console.log('Starting new game...');
            
            // Clear all browser storage and cache
            try {
                if (window.sessionStorage) {
                    sessionStorage.clear();
                }
                if (window.localStorage) {
                    localStorage.clear();
                }
            } catch (e) {
                console.log('Storage clear error:', e);
            }
            
            // Multiple redirect methods for compatibility
            window.location.href = 'index.html';
        }

        function createFireworks() {
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.velocity = {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    };
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                }

                update() {
                    this.velocity.y += 0.1;
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    this.alpha -= this.decay;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function createFirework() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.5;
                const colors = ['#ff3366', '#00d9ff', '#ffd700', '#ff6b6b', '#4ecdc4'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            function animate() {
                ctx.fillStyle = 'rgba(10, 14, 26, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                particles.forEach((particle, index) => {
                    if (particle.alpha <= 0) {
                        particles.splice(index, 1);
                    } else {
                        particle.update();
                        particle.draw();
                    }
                });

                if (Math.random() < 0.05) {
                    createFirework();
                }

                requestAnimationFrame(animate);
            }

            animate();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // Wait for Firebase to be ready
        if (window.firebaseReady) {
            init();
        } else {
            window.addEventListener('firebaseReady', init);
        }
        
        // Expose startNewGame to global scope
        window.startNewGame = startNewGame;
    </script>
</body>
</html>
