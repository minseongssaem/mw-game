<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME - 회원가입</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --w-color: #00d9ff;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-align: center;
            margin-bottom: 10px;
        }

        .logo .m-letter {
            color: var(--m-color);
            text-shadow: 0 0 20px var(--m-glow);
        }

        .logo .w-letter {
            color: var(--w-color);
            text-shadow: 0 0 20px var(--w-glow);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
            letter-spacing: 0.2em;
        }

        .form-panel {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 40px;
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 15px;
            background: var(--bg-dark);
            border: 2px solid var(--text-secondary);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--w-color);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .btn {
            width: 100%;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--m-color) 0%, var(--w-color) 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(255, 51, 102, 0.3),
                0 4px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 30px rgba(255, 51, 102, 0.4),
                0 6px 30px rgba(0, 217, 255, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--w-color);
            color: var(--w-color);
        }

        .error-message {
            background: rgba(255, 51, 102, 0.2);
            border: 1px solid var(--m-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: var(--m-color);
            text-align: center;
            display: none;
        }

        .success-message {
            background: rgba(0, 217, 255, 0.2);
            border: 1px solid var(--w-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: var(--w-color);
            text-align: center;
            display: none;
        }

        .link-text {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .link-text a {
            color: var(--w-color);
            text-decoration: none;
            font-weight: 600;
        }

        .link-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
            }
            
            .form-panel {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="m-letter">M</span><span class="w-letter">W</span>
        </div>
        <div class="subtitle">회원가입</div>

        <div class="form-panel">
            <div class="form-title">새 계정 만들기</div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" id="password" placeholder="최소 6자 이상" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label">비밀번호 확인</label>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="비밀번호 재입력" required>
                </div>

                <div class="form-group">
                    <label class="form-label">이름 (닉네임)</label>
                    <input type="text" class="form-input" id="displayName" placeholder="게임에서 사용할 이름" required>
                </div>

                <button type="submit" class="btn btn-primary">가입하기</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">취소</button>
            </form>

            <div class="link-text">
                이미 계정이 있으신가요? <a href="login.html">로그인</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCC0wATHn9czB7bwCn5RijT5zHpRF9_xS8",
            authDomain: "mw-game-954a8.firebaseapp.com",
            databaseURL: "https://mw-game-954a8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mw-game-954a8",
            storageBucket: "mw-game-954a8.firebasestorage.app",
            messagingSenderId: "768733083712",
            appId: "1:768733083712:web:7f194e8a59514eb74447a5"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        
        window.auth = auth;
        window.database = database;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.updateProfile = updateProfile;
        window.dbRef = ref;
        window.dbSet = set;
        
        console.log("Firebase initialized!");
    </script>

    <script>
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        async function handleSignup(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const displayName = document.getElementById('displayName').value;

            // 비밀번호 확인
            if (password !== confirmPassword) {
                showError('비밀번호가 일치하지 않습니다');
                return;
            }

            try {
                // Firebase Authentication 회원가입
                const userCredential = await window.createUserWithEmailAndPassword(
                    window.auth, 
                    email, 
                    password
                );
                
                const user = userCredential.user;

                // 프로필 업데이트
                await window.updateProfile(user, {
                    displayName: displayName
                });

                // Realtime Database에 사용자 정보 저장
                await window.dbSet(window.dbRef(window.database, 'users/' + user.uid), {
                    email: email,
                    displayName: displayName,
                    role: 'host', // 기본 역할: 진행자
                    status: 'pending', // 승인 대기 상태
                    createdAt: Date.now()
                });

                showSuccess('회원가입 성공! 로그인 페이지로 이동합니다...');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = '회원가입 중 오류가 발생했습니다';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = '이미 사용 중인 이메일입니다';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = '유효하지 않은 이메일 형식입니다';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = '비밀번호가 너무 약합니다 (최소 6자)';
                }
                
                showError(errorMessage);
            }
        }

        window.handleSignup = handleSignup;
    </script>
</body>
</html>
