<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW GAME - 대기실</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-mid: #151b2e;
            --bg-light: #1e2842;
            --m-color: #ff3366;
            --m-glow: #ff1744;
            --w-color: #00d9ff;
            --w-glow: #00bcd4;
            --accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }

        .logo .m-letter {
            color: var(--m-color);
            text-shadow: 0 0 20px var(--m-glow);
            animation: pulseM 3s ease-in-out infinite;
        }

        .logo .w-letter {
            color: var(--w-color);
            text-shadow: 0 0 20px var(--w-glow);
            animation: pulseW 3s ease-in-out infinite;
        }

        @keyframes pulseM {
            0%, 100% { text-shadow: 0 0 20px var(--m-glow); }
            50% { text-shadow: 0 0 40px var(--m-glow); }
        }

        @keyframes pulseW {
            0%, 100% { text-shadow: 0 0 20px var(--w-glow); }
            50% { text-shadow: 0 0 40px var(--w-glow); }
        }

        .subtitle {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .room-info {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto 30px;
            text-align: center;
        }

        .room-code {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: var(--accent);
            letter-spacing: 0.3em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        .room-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--text-secondary);
        }

        .detail-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--w-color);
        }

        .teams-panel {
            background: var(--bg-mid);
            border: 2px solid var(--bg-light);
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 20px;
            text-align: center;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .team-card {
            background: var(--bg-dark);
            border: 2px solid var(--text-secondary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .team-card.joined {
            border-color: var(--w-color);
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .team-card.my-team {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .team-number {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .team-status {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .team-card.joined .team-status {
            color: var(--w-color);
        }

        .team-card.my-team .team-status {
            color: var(--accent);
        }

        .btn {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 20px 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--m-color) 0%, var(--w-color) 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(255, 51, 102, 0.3),
                0 4px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 30px rgba(255, 51, 102, 0.4),
                0 6px 30px rgba(0, 217, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .action-panel {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .waiting-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .waiting-animation {
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .room-code {
                font-size: 2rem;
            }
            
            .teams-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="m-letter">M</span><span class="w-letter">W</span>
            </div>
            <div class="subtitle">Waiting Room</div>
        </div>

        <div class="room-info">
            <div class="room-code" id="roomCode">------</div>
            <div class="room-details">
                <div class="detail-item">
                    <div class="detail-label">팀 수</div>
                    <div class="detail-value" id="teamCount">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">회의 시간</div>
                    <div class="detail-value" id="discussionTime">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">제출 시간</div>
                    <div class="detail-value" id="submitTime">-</div>
                </div>
            </div>
        </div>

        <div class="teams-panel">
            <div class="panel-title">참가 팀 현황</div>
            <div class="teams-grid" id="teamsGrid">
                <!-- Teams will be generated dynamically -->
            </div>
        </div>

        <div class="action-panel">
            <div id="hostPanel" style="display: none;">
                <div class="waiting-message">
                    <span id="joinedCount">0</span> / <span id="totalCount">0</span> 팀 입장
                </div>
                <button class="btn btn-primary" onclick="startGame()" id="startButton" disabled>
                    <span>게임 시작</span>
                </button>
            </div>

            <div id="playerPanel" style="display: none;">
                <div class="waiting-message">
                    당신은 <span style="color: var(--accent); font-weight: 700;">팀 <span id="myTeamNumber">-</span></span> 입니다<br>
                    <span class="waiting-animation">게임 시작을 기다리는 중...</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCC0wATHn9czB7bwCn5RijT5zHpRF9_xS8",
            authDomain: "mw-game-954a8.firebaseapp.com",
            databaseURL: "https://mw-game-954a8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mw-game-954a8",
            storageBucket: "mw-game-954a8.firebasestorage.app",
            messagingSenderId: "768733083712",
            appId: "1:768733083712:web:7f194e8a59514eb74447a5"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        const mode = urlParams.get('mode'); // 'host' or 'player'
        const myTeam = urlParams.get('team');

        let roomData = null;
        let joinedTeams = [];

        function init() {
            if (!roomCode) {
                alert('방 코드가 없습니다');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('roomCode').textContent = roomCode;

            // Show appropriate panel
            if (mode === 'host') {
                document.getElementById('hostPanel').style.display = 'block';
            } else {
                document.getElementById('playerPanel').style.display = 'block';
                document.getElementById('myTeamNumber').textContent = myTeam;
            }

            // Listen to room data
            listenToRoom();
        }

        function listenToRoom() {
            const roomRef = ref(database, 'rooms/' + roomCode);
            onValue(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    roomData = snapshot.val();
                    updateUI();
                } else {
                    alert('방을 찾을 수 없습니다');
                    window.location.href = 'index.html';
                }
            });
        }

        function updateUI() {
            // Update room details
            document.getElementById('teamCount').textContent = roomData.teamCount + '팀';
            document.getElementById('discussionTime').textContent = (roomData.discussionTime / 60) + '분';
            document.getElementById('submitTime').textContent = (roomData.submitTime >= 60 ? (roomData.submitTime / 60) + '분' : roomData.submitTime + '초');

            // Get joined teams
            joinedTeams = roomData.teams ? Object.values(roomData.teams).map(t => t.teamNumber) : [];

            // Update teams grid
            const teamsGrid = document.getElementById('teamsGrid');
            teamsGrid.innerHTML = '';

            for (let i = 1; i <= roomData.teamCount; i++) {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card';
                
                const isJoined = joinedTeams.includes(i);
                const isMyTeam = mode === 'player' && parseInt(myTeam) === i;

                if (isMyTeam) {
                    teamCard.classList.add('my-team');
                } else if (isJoined) {
                    teamCard.classList.add('joined');
                }

                teamCard.innerHTML = `
                    <div class="team-number">팀 ${i}</div>
                    <div class="team-status">${isMyTeam ? '내 팀' : (isJoined ? '입장 완료' : '대기 중')}</div>
                `;

                teamsGrid.appendChild(teamCard);
            }

            // Update host panel
            if (mode === 'host') {
                document.getElementById('joinedCount').textContent = joinedTeams.length;
                document.getElementById('totalCount').textContent = roomData.teamCount;

                const startButton = document.getElementById('startButton');
                if (joinedTeams.length === roomData.teamCount) {
                    startButton.disabled = false;
                } else {
                    startButton.disabled = true;
                }
            }

            // Check if game started
            if (roomData.status === 'playing') {
                if (mode === 'host') {
                    window.location.href = `game-host.html?room=${roomCode}`;
                } else {
                    window.location.href = `game-player.html?room=${roomCode}&team=${myTeam}`;
                }
            }
        }

        function startGame() {
            // Update room status to 'playing' in Firebase
            update(ref(database, 'rooms/' + roomCode), {
                status: 'playing',
                gamePhase: 'discussion',
                currentRound: 1
            }).then(() => {
                // Immediately redirect
                if (mode === 'host') {
                    window.location.href = `game-host.html?room=${roomCode}`;
                } else {
                    window.location.href = `game-player.html?room=${roomCode}&team=${myTeam}`;
                }
            }).catch(error => {
                console.error('Error starting game:', error);
                alert('게임 시작 중 오류가 발생했습니다');
            });
        }

        window.startGame = startGame;

        // Initialize when page loads
        init();
    </script>
</body>
</html>
